<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="brAIn">
  <rect width="512" height="512" fill="#000000"/>
  <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="square" stroke-linejoin="miter">
