<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="OmniControl mette al lavoro gli assistenti AI che hai già, sul tuo computer. Il sito arriva a breve.">
  <title>OmniControl</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --muted: #9a9a9a;
      --line: #1f1f1f;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    main {
      width: 100%;
      max-width: 40rem;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }
    .mark {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 10px;
      background: var(--fg);
      vertical-align: 0.1em;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 9vw, 3.5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }
    p {
      margin: 0;
      max-width: 36ch;
      color: var(--muted);
      font-size: clamp(1rem, 3.6vw, 1.125rem);
    }
  </style>
</head>
<body>
  <main>
    <h1><span class="mark" aria-hidden="true"></span>OmniControl</h1>
    <p>Il sito arriva a breve. Il primo rilascio pubblico comparirà qui.</p>
  </main>
</body>
</html>
